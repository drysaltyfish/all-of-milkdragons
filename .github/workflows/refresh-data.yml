name: Refresh data

# 数据不是静态的：每天跑一次 update.py 重新探测全部奶龙大学域名，
# 把 result.json / logos/ / logo_tones.json 的变化提交回仓库。
#
# ⚠️ 为什么最后要手动 `gh workflow run deploy.yml`：
#    用 GITHUB_TOKEN 推上来的提交**不会**再触发 push 类 workflow（GitHub 防递归），
#    所以刷新数据这一步必须显式地把部署点起来。

on:
  schedule:
    # UTC 19:10 == 北京时间次日 03:10，躲开整点排队
    - cron: '10 19 * * *'
  workflow_dispatch:

permissions:
  contents: write # 提交抓取结果
  actions: write # 手动触发部署 workflow
  issues: write # 投稿被自动收录后回评/关闭 issue

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 域名多的时候全量探测可能要几十分钟，给足余量
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install python dependencies
        run: pip install -r requirements.txt

      # 纯函数单测，不联网，几秒钟。放在抓取前面：
      # 跳转规则 / 校徽明暗 / 退避与保留 / 投稿规则改错了就地拦下，
      # 别等抓完 20 分钟才发现一堆域名又跳去了百度。
      - name: 跑回归测试
        run: |
          python tests/test_jump_rules.py
          python tests/test_logo_tone.py
          python tests/test_retention.py
          python tests/test_community.py

      - name: 阶段 1-3：DNS + HTTP + 标题/校徽抓取
        run: python update.py

      # 去底色 + 裁空白 + 限尺寸。必须在体检之前跑：体检看的是处理后的像素
      - name: 校徽后处理
        run: python process_logos.py

      - name: 校徽明暗体检
        run: python analyze_logos.py

      # update.py 只写不删，不清理的话 logos/ 会随日报无限膨胀
      - name: 清理未被引用的校徽
        run: python prune_logos.py

      # ★ 投稿闭环：抓完 update.py 会把「落点在受限教育域名上」的 pending 投稿
      #   自动升成 approved 并写进 community-domains.json，这里把结果回评给投稿人。
      #   注意顺序：必须在 update.py 之后（store 才刚被更新）。
      # ★ notify 自身幂等：只吐 notified_at 为空的行并就地写回标记，
      #   随本次数据提交一起落库，同一天重复触发不会再回评。
      - name: 回复被自动收录的投稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python triage_report.py notify | \
          while IFS=$'\t' read -r issue domain note; do
            [ -n "$issue" ] || continue
            # ★ 关掉的 issue 一律不再回复：回评本身不幂等（评论不能撤回），
            #   这是防重复回评的最后一道闸，也用来兜住修复前遗留的重复。
            state=$(gh issue view "$issue" --json state --jq .state 2>/dev/null || true)
            if [ "$state" = "CLOSED" ]; then
              echo "issue #$issue 已关闭，跳过回复"
              continue
            fi
            gh issue comment "$issue" --body \
              "已验证：\`$domain\` 确实跳转到一所学校的官网，已自动收录。下一次部署后出现在页面上。" || true
            gh issue edit "$issue" --add-label 已收录 || true
            gh issue close "$issue" || true
          done

      - name: 提交数据变更
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A result.json logos logo_tones.json community-domains.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本次抓取结果与上次一致，无需提交。"
            exit 0
          fi

          git commit -m "chore(data): $(date -u +%F) 自动刷新奶龙大学域名数据"

          # ★ 先 rebase 再推，并且重试。
          #   抓取要跑半小时以上，这期间随时可能有人推代码/文档 —— 以前这里直接
          #   `git push`，一撞上就是 non-fast-forward 失败，**整整半小时的抓取
          #   结果全部丢掉**（实测 run 38575745145 就是这样浪费了 44 分钟）。
          #
          # ★ 用 fetch + rebase 而不是 `git pull --rebase`：checkout 出来的 HEAD
          #   不一定 attach 在分支上，而 `git rebase <upstream>` 在游离 HEAD 上也
          #   能用；推送用 `HEAD:ref` 显式指明目标。
          # ★ `-X theirs` 而不是 `-X ours`：rebase 里这两个是**反的** ——
          #   ours 指的是「已经 rebase 上去的 upstream」，theirs 才是我们这次
          #   正在应用的提交（也就是刚抓出来的数据）。冲突时以本地数据为准。
          pushed=false
          for i in 1 2 3 4 5; do
            if git fetch origin "${GITHUB_REF_NAME}" \
               && git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，10 秒后重试"
            sleep 10
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::推送重试 5 次仍然失败；本轮抓取结果见下方 artifact"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 GitHub Pages 部署
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"

      # 抓取结果同时留一份 artifact，方便失败时回查
      - name: 上传本次抓取产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-result-${{ github.run_number }}
          path: |
            result.json
            logo_tones.json
          retention-days: 14
